<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Anmelden…</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap" style="text-align:center;padding-top:80px;">
  <div style="font-family:'IBM Plex Mono',monospace;font-size:0.85rem;color:var(--ink-soft);">
    <div class="loading-big"><div class="spin"></div>Anmeldung wird verarbeitet&hellip;</div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL || "";
const SUPABASE_KEY = window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY || "";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// Processa o token que o Supabase envia via URL hash (#access_token=...&type=...)
// onAuthStateChange captura o SIGNED_IN logo após o Supabase processar o hash
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) {
    location.href = 'trainer.html#/config';
  }
});

// Fallback: se já tem sessão válida, vai direto
const { data: { session } } = await supabase.auth.getSession();
if (session) location.href = 'trainer.html#/config';

// Timeout de segurança — se não redirecionar em 5s, volta pro login
setTimeout(() => { location.href = 'login.html'; }, 5000);
</script>
</body>
</html>
