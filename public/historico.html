<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verlauf — Schreibtrainer</title>
<link rel="stylesheet" href="css/styles.css">
<style>
.hist-loading, .hist-empty{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.82rem;
  color:var(--ink-soft);
  padding:20px 0;
}
.hist-card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:16px 18px;
  margin-bottom:12px;
  transition:border-color .15s;
}
.hist-card:hover{border-color:var(--ink-soft);}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.hist-thema{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;}
.hist-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.65rem;
  letter-spacing:0.04em;
  padding:4px 9px;
  border-radius:20px;
  white-space:nowrap;
  flex-shrink:0;
}
.hist-badge.gut{background:#e8f0e9;color:var(--sage);}
.hist-badge.ok{background:#fdf5e6;color:var(--seal);}
.hist-badge.schlecht{background:#fdecea;color:var(--rule-red);}
.hist-meta{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.68rem;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.hist-tipp{
  font-size:0.85rem;
  color:var(--ink-soft);
  border-left:2px solid var(--sage);
  padding-left:10px;
  line-height:1.4;
}
.filter-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.filter-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.7rem;
  letter-spacing:0.04em;
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--ink-soft);
  cursor:pointer;
}
.filter-btn.active{background:var(--ink);color:var(--paper-card);border-color:var(--ink);}
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:14px 16px;
  text-align:center;
}
.stat-val{
  font-family:'Fraunces',serif;
  font-size:2rem;
  font-weight:700;
  color:var(--rule-red);
  display:block;
}
.stat-lbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.65rem;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.06em;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Verlauf</h1>
      <div class="sub">Deine Schreibübungen &amp; Korrekturen</div>
    </div>
    <div style="display:flex;gap:14px;align-items:center;">
      <span id="userEmail" style="font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ink-soft);"></span>
      <a class="home-link" href="trainer.html#/config">+ Neue Übung</a>
      <a class="home-link" href="#" onclick="doSignOut();return false;">Abmelden</a>
      <a class="home-link" href="index.html">← Startseite</a>
    </div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><span class="stat-val" id="statTotal">—</span><span class="stat-lbl">Übungen gesamt</span></div>
    <div class="stat-card"><span class="stat-val" id="statErreicht">—</span><span class="stat-lbl">Niveau erreicht</span></div>
    <div class="stat-card"><span class="stat-val" id="statBestes">—</span><span class="stat-lbl">Bestes Niveau</span></div>
    <div class="stat-card"><span class="stat-val" id="statLetzte">—</span><span class="stat-lbl">Letzte Übung</span></div>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" data-filter="all">Alle</button>
    <button class="filter-btn" data-filter="A2">A2</button>
    <button class="filter-btn" data-filter="B1">B1</button>
    <button class="filter-btn" data-filter="B2">B2</button>
    <button class="filter-btn" data-filter="C1">C1</button>
  </div>

  <div id="historicoLista"></div>

  <div class="disclaimer">Os dados ficam guardados no Supabase e são acessíveis de qualquer dispositivo.</div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL || "";
const SUPABASE_KEY = window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY || "";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = 'login.html'; }

const $ = id => document.getElementById(id);
function escapeHtml(str){ const d=document.createElement('div');d.textContent=str||'';return d.innerHTML; }

// Show user email
const userEl = $('userEmail');
if (userEl && session) userEl.textContent = session.user.email;

function sbFetch(path, options={}){
  const headers=Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + session.access_token,
    'Content-Type':'application/json'
  }, options.headers||{});
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`,Object.assign({},options,{headers}));
}

window.doSignOut = async () => { await supabase.auth.signOut(); location.href = 'login.html'; };

let todosDados = [];
let filtroAtivo = 'all';

function niveauParaNum(n){
  const m={'A2':1,'A2+':1.5,'B1-':1.8,'B1':2,'B1+':2.5,'B2-':2.8,'B2':3,'B2+':3.5,'C1-':3.8,'C1':4,'C1+':4.5};
  return m[n]||0;
}

async function carregar(){
  const el=$('historicoLista');
  el.innerHTML='<div class="hist-loading">Laden&hellip;</div>';
  try {
    const res=await sbFetch('historico?select=*&order=created_at.desc&limit=200');
    todosDados=await res.json();
    if(!Array.isArray(todosDados)) todosDados=[];
    renderStats();
    renderLista();
  } catch(e){
    el.innerHTML='<div class="hist-empty">Fehler beim Laden. Bitte Seite neu laden.</div>';
  }
}

function renderStats(){
  const d=todosDados;
  $('statTotal').textContent=d.length;
  const erreicht=d.filter(r=>r.status==='erreicht'||r.status==='übertroffen').length;
  $('statErreicht').textContent=d.length?Math.round(erreicht/d.length*100)+'%':'—';
  const melhor=d.reduce((best,r)=>{
    const n=niveauParaNum(r.nivel_atingido);
    return n>niveauParaNum(best)?r.nivel_atingido:best;
  },'');
  $('statBestes').textContent=melhor||'—';
  if(d.length){
    const dt=new Date(d[0].created_at);
    $('statLetzte').textContent=dt.toLocaleDateString('de-DE');
  } else {
    $('statLetzte').textContent='—';
  }
}

function renderLista(){
  const el=$('historicoLista');
  const dados=filtroAtivo==='all'?todosDados:todosDados.filter(r=>r.niveau===filtroAtivo);
  if(dados.length===0){
    el.innerHTML='<div class="hist-empty">Noch keine Einträge für dieses Niveau.</div>';
    return;
  }
  el.innerHTML=dados.map(r=>{
    const data=new Date(r.created_at).toLocaleDateString('de-DE');
    const hora=new Date(r.created_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    const sc=r.status==='erreicht'||r.status==='übertroffen'?'gut':r.status==='knapp erreicht'?'ok':'schlecht';
    return `<div class="hist-card">
      <div class="hist-top">
        <span class="hist-thema">${escapeHtml(r.thema)}</span>
        <span class="hist-badge ${sc}">${escapeHtml(r.nivel_atingido||'—')} · ${escapeHtml(r.status||'—')}</span>
      </div>
      <div class="hist-meta">${escapeHtml(r.niveau)} · ${escapeHtml(r.textsorte)} · Schwierigkeit ${r.schwierigkeit}/8 · ${data} ${hora}</div>
      <div class="hist-tipp">→ ${escapeHtml(r.tipp||'')}</div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filtroAtivo=btn.dataset.filter;
    renderLista();
  });
});

carregar();
</script>
</body>
</html>
